# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java#apache-maven-with-a-settings-path

name: Github Travis

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  workflow_dispatch: # For manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          distribution: "temurin"
          java-version: "21"
          java-package: jdk

      - name: Prepare p2 VPS access
        run: |
          echo "Publishing p2 repository"
          sed -i "s/<username>GAMA_PLATFORM/<username>$GAMA_SERVER_USERNAME/g" $GITHUB_WORKSPACE/settings.xml
          sed -i "s/<password>GAMA_PLATFORM/<password>$GAMA_SERVER_PASSWORD/g" $GITHUB_WORKSPACE/settings.xml
        env:
          GAMA_SERVER_USERNAME: ${{ secrets.GAMA_SERVER_USERNAME }}
          GAMA_SERVER_PASSWORD: ${{ secrets.GAMA_SERVER_PASSWORD }}

      - name: Install SSH key
        # Consider it's a release and want to update p2 site for it
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.GAMA_SERVER_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.GAMA_SERVER_SSH_KNOWN_HOSTS }}
          if_key_exists: replace # replace / ignore / fail; optional (defaults to fail)

      - name: Build with Maven & Publish p2
        run: bash $GITHUB_WORKSPACE/build.sh
